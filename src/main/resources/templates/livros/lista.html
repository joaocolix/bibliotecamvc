<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>
    <h1>Livros</h1>

    <form th:action="@{/livros}" method="post">
        <label for="titulo">Título</label>
        <input id="titulo" name="titulo" type="text" required>

        <label for="autor">Autor</label>
        <input id="autor" name="autor" type="text" required>

        <label for="isbn">ISBN</label>
        <input id="isbn" name="isbn" type="text" required>

        <button type="submit">Cadastrar</button>
    </form>

    <h2>Lista de livros</h2>

    <p th:if="${#lists.isEmpty(livros)}">Nenhum livro cadastrado.</p>

    <ul th:if="${!#lists.isEmpty(livros)}">
        <li th:each="livro, item : ${livros}">
            <span th:text="${livro.titulo}"></span>
            -
            <span th:text="${livro.autor}"></span>
            -
            <span th:text="${livro.isbn}"></span>

            <form th:action="@{/livros/excluir/{indice}(indice=${item.index})}" method="post" style="display:inline">
                <input type="hidden" name="_method" value="delete">
                <button type="submit">Excluir</button>
            </form>
        </li>
    </ul>

    <a th:href="@{/livros/inicio}">Voltar</a>
</body>
</html>
